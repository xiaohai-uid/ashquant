[project]
name = "ashquant"
version = "0.1.0"
description = "A股本地量化平台：行情查看 / 规则保真回测 / 次日概率预测 / 模拟盘（诚实指标，默认模拟盘，不构成投资建议）"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "ashquant contributors" }]
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "akshare>=1.14",
    "typer>=0.12",
    "rich>=13.0",
    "pyarrow>=15.0",
    "requests>=2.31",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29"]
ml = ["scikit-learn>=1.4"]

[project.scripts]
ashquant = "ashquant.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashquant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B904", "B905", "B008", "E741"]
